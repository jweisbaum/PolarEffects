[package]
name = "pe-env"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PolarEffects reanalysis archive readers and sampling (network)."

[dependencies]
pe-core = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

# `default-features = false` is load-bearing, as in VectorEffects' ve-zarr:
# the default set turns on `blosc`, which builds c-blosc and its bundled
# Snappy through a C++ toolchain. Every store read here is blosc/lz4, which
# `blosc.rs` decodes in Rust. `filesystem` reads recorded fixture stores.
zarrs = { version = "0.23", default-features = false, features = ["filesystem"] }
zarrs_storage = "0.4"
lz4_flex = { version = "0.14", default-features = false, features = ["std"] }

# The archives are read over HTTPS by `http.rs`, not `zarrs_http` (which takes
# reqwest's default native-tls, i.e. OpenSSL on Linux). reqwest's `rustls`
# feature selects the aws-lc-rs provider, a C library; `rustls-no-provider`
# plus our own ring-backed `ClientConfig` (`net.rs`) keeps the build pure
# Rust on all five targets (CLAUDE.md, D6).
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
url = "2"

[lints]
workspace = true
