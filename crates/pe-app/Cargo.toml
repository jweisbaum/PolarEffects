[package]
name = "pe-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PolarExplorer desktop application."
# Development utilities live in examples/ so Tauri bundles only the app.
default-run = "pe-app"

[lib]
name = "pe_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pe-app"
path = "src/main.rs"

[dependencies]
pe-core = { workspace = true }
pe-polar = { workspace = true }
pe-orc = { workspace = true }
pe-tracks = { workspace = true }
pe-trackers = { workspace = true }
pe-env = { workspace = true }
pe-grib = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Platform config, data and cache directories (spec.md 3.4).
directories = "6.0.0"
thiserror = { workspace = true }
ts-rs = { workspace = true }
tauri = { version = "2.11.5", features = [] }
# Native Open / Save As / folder pickers (spec.md 3.1, 3.4).
tauri-plugin-dialog = "2.7.3"
# End-to-end automation, never in a shipped build.
tauri-plugin-webdriver-automation = { version = "0.1.3", optional = true }

# Native PostgreSQL protocol and platform-verified TLS; no libpq or sidecar.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v5", "v4"] }

[features]
# WebDriver automation for agent-driven UI tests (macOS), off by default.
# Copied from VectorEffects (D25).
#
# **The plugin binds a TCP listener.** It serves an axum WebDriver endpoint on
# `127.0.0.1` at a random port, printed to stdout, and that endpoint can click,
# type, screenshot and read the DOM — the whole interface, to any process on
# the machine that reads the port. Invariant 4 says nothing is fetched that the
# user did not ask for and nothing reaches in, and an inbound socket that
# drives the application is exactly what "nothing reaches in" rules out.
#
# So it is optional, and `npm run build` does not pass it: a release bundle
# contains no `axum` and opens no port. `npm run check:offline` cannot enforce
# that — it reads source URLs, bundle references and the CSP, not listeners —
# so the enforcement is that the dependency is not compiled in at all
# (`tests/webdriver_optional.rs`). The feature also gates the three
# automation seams in this crate: `PE_AUTOMATION_ROOT` (`paths.rs`),
# `PE_DRIVER_YELLOWBRICK` (`trackers.rs`) and `PE_DRIVER_REANALYSIS`
# (`grib.rs`).
#
#   npm run dev:webdriver     # the app with the endpoint
#   npm run ux                # the agentic UX suite (tools/webdriver/ux)
#   cargo build -p pe-app --features webdriver
webdriver = ["dep:tauri-plugin-webdriver-automation"]

[dev-dependencies]
# Writing a project archive by hand, for the newer-schema refusal test.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Pinning the export hashes the CI matrix compares (invariant 5, plan.md M14).
# Pure Rust, already in the lock file through Tauri.
sha2 = "0.10.9"
# The GRIB export's tests decode what it wrote with the test-only reader.
pe-grib = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
