[package]
name = "pe-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PolarEffects desktop application."
# Development utilities live in examples/ so Tauri bundles only the app.
default-run = "pe-app"

[lib]
name = "pe_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pe-app"
path = "src/main.rs"

[dependencies]
pe-core = { workspace = true }
pe-polar = { workspace = true }
pe-orc = { workspace = true }
pe-tracks = { workspace = true }
pe-trackers = { workspace = true }
pe-env = { workspace = true }
pe-grib = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Platform config, data and cache directories (spec.md 3.4).
directories = "6.0.0"
thiserror = { workspace = true }
ts-rs = { workspace = true }
tauri = { version = "2.11.5", features = [] }
# Native Open / Save As / folder pickers (spec.md 3.1, 3.4).
tauri-plugin-dialog = "2.7.3"

[dev-dependencies]
# Writing a project archive by hand, for the newer-schema refusal test.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
