[package]
name = "pe-trackers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PolarEffects race tracker clients and decoders (network)."

[dependencies]
pe-tracks = { workspace = true }
pe-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Geovoile's viewer HTML carries the hwx seeds in base64 script segments.
base64 = "0.22"
percent-encoding = "2"
# Geovoile's config resource is XML; quick-xml is already in the tree.
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }
# Browser-grade HTML parsing for the user-requested public ORR catalogue.
dom_query = "0.28"
# Tracker answers are asked for gzipped and inflated here (M14b); pure Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# The same pure-Rust TLS stack as pe-env (see its Cargo.toml): reqwest with
# `rustls-no-provider` and a ring-backed ClientConfig, so no aws-lc-rs.
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[lints]
workspace = true
